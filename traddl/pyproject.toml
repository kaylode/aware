[build-system]
requires = ["setuptools==75.8.2", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["traddl"]

[project]
name = "traddl"
version = "1.0.0"
description = "traddl"
readme = "README.md"
authors = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
maintainers = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "seaborn>=0.12.0",
    "plotly>=5.10.0",
    "matplotlib>=3.4.3",
    "webcolors>=1.12",
    "wandb>=0.13.3",
    "tensorboard>=2.10.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.1",
    "gdown>=4.5.1",
    "tabulate>=0.8.10",
    "loguru>=0.6.0",
    "kaleido>=0.2.1",
    "optuna>=3.0.5",
    "deepdiff>=6.2.3",
    "hydra-core>=1.3.2",
    "lightning>=2.0.0"
]