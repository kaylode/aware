defaults:
  - base/hydra@_here_
  - base/lightning@_here_
  - base/transform@_here_
  - base/finetune@_here_
  - _self_

data:
  dataloader:
    train:
      name: DataLoaderWithCollator
      args:
        batch_size: 64
        drop_last: true
        shuffle: false
        num_workers: 2
        sampler:
          name: BalanceSampler
          args:
    val:
      name: DataLoaderWithCollator
      args:
        batch_size: 64
        drop_last: false
        num_workers: 2
        shuffle: false
        
    test:
      name: DataLoaderWithCollator
      args:
        batch_size: 1
        drop_last: false
        num_workers: 1
        shuffle: false

model:
  name: CorebehrtForFineTuning
  args:
    hidden_size: 512 # word embedding and seg embedding hidden size
    type_vocab_size: 10
    max_position_embeddings: ${data.dataset.train.args.n_positions} #global_params[max_len_seq] # maximum number of tokens
    num_hidden_layers: 6 # number of multi-head attention layers required
    num_attention_heads: 4 # number of attention heads
    intermediate_size: 2048 # the size of the "intermediate" layer in the transformer encoder
    embedding_dropout: 0.1 
    age_scale: 1e-2 # 100 -> 1
    abspos_scale: 1e-5 # 400k -> 4
    age_shift: -50 # center around 0
    abspos_shift: -90000 # 0 will be around 2015
    sparse_pred_ignore_index: -100
    freeze_backbone: false