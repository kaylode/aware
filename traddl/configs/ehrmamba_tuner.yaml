defaults:
  - base/hydra@_here_
  - base/lightning@_here_
  - base/transform@_here_
  - base/finetune@_here_
  - _self_

trainer:
  name: plTrainer
  args:
    max_epochs: 5

data:
  dataloader:
    train:
      name: DataLoaderWithCollator
      args:
        batch_size: 16
        drop_last: true
        shuffle: false
        num_workers: 2
        sampler:
          name: BalanceSampler
          args:
    val:
      name: DataLoaderWithCollator
      args:
        batch_size: 16
        drop_last: false
        num_workers: 2
        shuffle: false
        
    test:
      name: DataLoaderWithCollator
      args:
        batch_size: 1
        drop_last: false
        num_workers: 1
        shuffle: false

model:
  name: MambaFinetune
  args:
    hidden_size: [256, 384, 512] # word embedding and seg embedding hidden size
    time_embeddings_size: 32
    visit_order_size: 3
    type_vocab_size: 10
    max_num_visits: 128
    max_seq_length: ${data.dataset.train.args.n_positions}
    state_size: 16
    num_hidden_layers: [2, 4, 6, 8] # number of multi-head attention layers required
    expand: 2
    conv_kernel: 4
    dropout_prob: 0.1
    use_mambapy: True
    classifier_dropout: 0.1
    freeze_backbone: false

optimizer:
  name: AdamW
  args:
    lr: [0.00001, 0.003]
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95

optuna:
  float:
    - optimizer.args.lr
  categorical:
    - model.args.hidden_size
    - model.args.num_hidden_layers