defaults:
  - base/hydra@_here_
  - base/lightning@_here_
  - base/transform@_here_
  - base/pretrain@_here_
  - _self_

data:
  dataloader:
    train:
      name: DataLoaderWithCollator
      args:
        batch_size: 8
        drop_last: true
        shuffle: true
        num_workers: 0
    val:
      name: DataLoaderWithCollator
      args:
        batch_size: 8
        drop_last: false
        num_workers: 0
        shuffle: false
    test:
      name: DataLoaderWithCollator
      args:
        batch_size: 1
        drop_last: false
        num_workers: 0
        shuffle: false

model:
  name: MambaPretrain
  args:
    hidden_size: 768 
    time_embeddings_size: 32
    visit_order_size: 3
    type_vocab_size: 10
    max_num_visits: 128
    max_seq_length: ${data.dataset.train.args.n_positions}
    state_size: 16
    num_hidden_layers: 6
    expand: 2
    conv_kernel: 4
    dropout_prob: 0.1
    use_mambapy: True