trainer:
  name: plTrainer
  args:
    devices: ${oc.env:NUM_GPUS}
    accelerator: gpu
    enable_progress_bar: false
    use_nccl_strategy: false
    max_epochs: 10
    num_sanity_val_steps: 1
    gradient_clip_val: 1.0
    deterministic: True
    enable_checkpointing: true
    enable_model_summary: False
    # accumulate_grad_batches: 16
    log_every_n_steps: 1000
    val_check_interval: 5000
    limit_val_batches: 512

metrics:
  - name: Accuracy
    args:
      ignore_index: ${data.dataset.train.args.masking_target_idx}
  - name: BalancedAccuracyMetric
    args:
      ignore_index: ${data.dataset.train.args.masking_target_idx}
  - name: F1ScoreMetric
    args:
      ignore_index: ${data.dataset.train.args.masking_target_idx}
      average: weighted
  - name: PrecisionRecall
    args:
      ignore_index: ${data.dataset.train.args.masking_target_idx}
      average: weighted

loss:
  name: ClassificationCELoss
  args:
    ignore_index: ${data.dataset.train.args.masking_target_idx}

optimizer:
  name: AdamW
  args:
    lr: 0.00006
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95


data:
  auto_split_ratio: 0.95
  dataset:
    train:
      name: MaskedLanguageModelDataset
      args:
        input_dir: ??
        n_positions: 2048
        select_ratio: 0.3
        masking_ratio: 0.6
        replace_ratio: 0.2
        ignore_special_tokens: true
        masking_target_idx: -100
        vocab_path: null
        append_cls: true

    test:
      name: MaskedLanguageModelDataset
      args:
        input_dir: ??
        n_positions: ${data.dataset.train.args.n_positions}
        select_ratio: 0.3
        masking_ratio: 0.6
        replace_ratio: 0.2
        ignore_special_tokens: true
        masking_target_idx: ${data.dataset.train.args.masking_target_idx}
        vocab_path: ${data.dataset.train.args.vocab_path}
        static_data_path: null