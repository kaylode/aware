trainer:
  name: plTrainer
  args:
    devices: ${oc.env:NUM_GPUS}
    accelerator: gpu
    enable_progress_bar: true
    use_nccl_strategy: false
    max_epochs: 20
    num_sanity_val_steps: 0
    gradient_clip_val: 1.0
    deterministic: True
    enable_checkpointing: True
    enable_model_summary: False
    log_every_n_steps: 10
    check_val_every_n_epoch: 1

metrics:
  - name: Accuracy
    args:
  - name: BalancedAccuracyMetric
    args:
  - name: F1ScoreMetric
    args:
      average: weighted
  - name: PrecisionRecall
    args:
      average: weighted

loss:
  name: ClassificationCELoss
  args:


optimizer:
  name: AdamW
  args:
    lr: 0.0004
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95

data:
  dataset:
    train:
      name: PatientOutcomeDataset
      args:
        input_dir: ??
        n_positions: 1024
        vocab_path: null
        padding_side: right
        append_cls: true
    val:
      name: PatientOutcomeDataset
      args:
        input_dir: ??
        n_positions: ${data.dataset.train.args.n_positions}
        vocab_path: ${data.dataset.train.args.vocab_path}
        padding_side: right
        append_cls: true
    test:
      name: PatientOutcomeDataset
      args:
        input_dir: ??
        n_positions: ${data.dataset.train.args.n_positions}
        vocab_path: ${data.dataset.train.args.vocab_path}
        padding_side: right
        append_cls: true