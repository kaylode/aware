global:
  exp_name: null
  exist_ok: false
  save_dir: runs
  resume: null
  pretrained: null

callbacks: 
  - name: TorchCheckpointCallback
    args:
      filename: best
      save_top_k: 1
      save_last: true
      monitor: weighted-f1
      mode: max
      every_n_train_steps: 1000
  - name: RichModelSummary
    args:
  - name: TensorboardCallback
    args:
  - name: WandbCallback
    args:
      username: kaylode
      project_name: tabpfn-ehr
      group_name: finetune #${oc.env:DATASET_NAME}
      job_type: train
      tags: 
        - METHOD:${oc.env:MODEL_NAME}
        - TASK:${oc.env:TASK_NAME}
        - CONTEXT_LENGTH:${data.dataset.train.args.n_positions}

data_name: ${oc.env:DATASET_NAME}
target_column: ${oc.env:TASK_NAME}

### These are for wandb consistent grouping
MODEL:
  MODEL_NAME: ${oc.env:MODEL_NAME}
  MODEL_CONFIGS:
    n_positions: ${data.dataset.train.args.n_positions}
DATA:
  BATCH_SIZE: ${data.dataloader.train.args.batch_size}
