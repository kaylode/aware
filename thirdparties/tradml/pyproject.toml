[build-system]
requires = ["setuptools==75.8.2", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradml"]

[project]
name = "tradml"
version = "1.0.0"
description = "Traditional ML Models"
readme = "README.md"
authors = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
maintainers = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = "==3.12"
dependencies = [
    "optuna==4.4.0",
    "optuna-integration==4.4.0",
    "numpy==1.26.4",
    "lightgbm==4.6.0",
    "wandb==0.19.9",
    "xgboost>=3.0",
    "tqdm==4.67.1",
    "tabulate==0.9.0",
    "scikit-plot==0.3.7",
    "scipy>=1.11.4",
    "seaborn==0.13.2",
    "shap==0.47.1",
    "numpy==1.26.4",
    "catboost==1.2.8",
    "lime>=0.2.0.1",
]

[tool.pyright]
typeCheckingMode = "off"
