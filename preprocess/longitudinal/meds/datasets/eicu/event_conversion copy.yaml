# Note that there is no "subject_id" for eICU -- patients are only differentiable during the course of a
# single health system stay. Accordingly, we set the "patient" id here as the "patientHealthSystemStayID"

subject_id_col: subject_id

### 
# PATIENTS
###

patient:
  gender:
    code: 
      - "GENDER"
      - "col(gender)"
    time: null
    uniquepid: "uniquepid"
    hadm_id: "patientunitstayid"
  age: 
    code: "AGE"
    time: col(age)
    time_format: "%Y-%m-%d %H:%M:%S"
    uniquepid: "uniquepid"
    hadm_id: "patientunitstayid"
  racial:
    code: "RACE"
    text_value: col(ethnicity)
    time: null
    uniquepid: "uniquepid"
    hadm_id: "patientunitstayid"
  dob:
    code: "MEDS_BIRTH" # This is the MEDS official code for BIRTH.
    time: col(dateofbirth)
    uniquepid: "uniquepid"
    hadm_id: "patientunitstayid"
  death:
    code: MEDS_DEATH # This is the MEDS official code for death.
    time: col(dod)
    time_format:
      - "%Y-%m-%d %H:%M:%S"
      - "%Y-%m-%d"
    uniquepid: "uniquepid"
    hadm_id: "patientunitstayid"
  hosp_admission:
    code:
      - "HOSPITAL_ADMISSION"
      - col(unitadmitsource)
    time: col(hospitaladmittimestamp)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: "patientunitstayid"
  hosp_discharge:
    code:
      - "HOSPITAL_DISCHARGE"
      - col(unitdischargelocation)
    time: col(hospitaldischargetimestamp)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: "patientunitstayid"

