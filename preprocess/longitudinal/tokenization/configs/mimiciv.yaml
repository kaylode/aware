defaults:
  - tokenization@_here_
  - _self_

use_vocab: true
tensorize: true
add_static_data_to_vocab: true
manually_added_tokens:
  - "[MASK]"
  - "[CLS]"
  - "[SEP]"
  - "[PAD]"
  - "[UNK]"

tensorize_with_labels: false
label_folder: null
split_train_val: false
train_ratio: null
required_codes_fn: null

dataset:
  name: mimic
  stages:

    - name: filter_codes_retain
      params:
        codes_to_keep:
          - MEDS_BIRTH
          - MEDS_DEATH
          - ACUITY
          - Blood Pressure
          - O2_SATURATION
          - PAIN
          - RESPIRATORY_RATE
          - TEMPERATURE
          - DIAGNOSIS
          - DRG
          - ED_OUT
          - ED_REGISTRATION
          - GENDER
          - HEART_RATE
          - HOSPITAL_ADMISSION
          - HOSPITAL_DISCHARGE
          - ICU_ADMISSION
          - ICU_DISCHARGE
          - INFUSION
          - LAB
          - MEDICATION
          - PROCEDURE
          - TRANSFER_TO
        is_prefix: true
  
    - name: preprocessing
      transforms:
        - TransferData.unify_transfer_names
        - DemographicData.retrieve_demographics_from_hosp_adm
        - DemographicData.process_gender
        - DemographicData.process_race
        - DemographicData.process_marital_status
        - InpatientData.process_drg_codes
        - InpatientData.process_hospital_admissions
        - InpatientData.process_hospital_discharges # must be before processing diagnoses
        - DeathData.place_death_before_dc_if_same_time
        - EdData.process_ed_registration
        - EdData.process_ed_acuity
        - MeasurementData.process_simple_measurements
        - MeasurementData.process_pain
        - MeasurementData.process_blood_pressure
        - LabData.retain_only_test_with_numeric_result
        - ICUStayData.retain_only_infusion_with_numeric_result
        - ProcedureData.unify_procedures
      vocab: ${vocab}

    - name: convert_icd_9_to_10
      transforms:
        - DiagnosesData.prepare_codes_for_processing
        - DiagnosesData.convert_icd_9_to_10
        - ProcedureData.prepare_codes_for_processing
        - ProcedureData.convert_icd_9_to_10
      vocab: ${vocab}

    - name: convert_medication_to_atc
      transforms:
        - MedicationData.convert_to_atc
      vocab: ${vocab}

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}_1
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_labs_with_counts
      transforms:
        - LabData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 150
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icu_infusion_with_counts
      transforms:
        - ICUStayData.filter_infusion_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 40
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_drg_with_counts
      transforms:
        - InpatientData.filter_drg_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 200
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_procedures_with_counts
      transforms:
        - ProcedureData.filter_procedures_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 80
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    ####
    ## Uncomment if you want to filter ICD based on counts
    ## Not recommended for ETHOS because we want to keep all codes
    ####

    - name: preprocessing_medication_with_counts
      transforms:
        - MedicationData.filter_medication_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 300
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icd10cm_with_counts
      transforms:
        - DiagnosesData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 4000
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icd10pcs_with_counts
      transforms:
        - ProcedureData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 1000
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    

    - name: reassign_admission_id # This is optional for BEHRT, to determine <SEP> token
      transforms:
        - InpatientData.reassign_admission_id
      vocab: ${vocab}

    - name: remove_consecutive_same_codes

    - name: add_missing_hospital_admission
      transforms:
        - AdmissionData.add_missing_hospital_admission

    - name: add_admission_time_offsets_as_column
      transforms:
        - AdmissionData.add_admission_time_offsets_as_column

    - name: add_age_offsets_as_column # Age as columns for BEHRT-based approaches
      transforms:
        - DemographicData.add_age_offsets_as_column

    - name: add_ehrmamba_required_columns
      transforms:
        - TokenTypeIDs.add_token_type_ids
        - AdmissionData.add_admission_time_offsets_as_column


    - name: filter_codes_retain
      params:
        codes_to_keep:
          # - ADMISSION_TYPE
          - ATC
          # - DRG//
          # - ED_
          # - GENDER
          - HOSPITAL_ADMISSION
          - HOSPITAL_DISCHARGE
          - ICD//CM 
          - ICD//PCS
          # - ICU_ADMISSION
          # - ICU_DISCHARGE
          # - LAB
          # - INFUSION//
          # - INSURANCE//
          # - MARITAL//
          # - MEDS_BIRTH 
          # - MEDS_DEATH
          - PROCEDURES//
          # - RACE//
          # - TRANSFER//
          # - VITAL//
        is_prefix: true

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}

    - name: FinalizeData
      params:
        columns: 
          - subject_id
          - admission_id
          - edstay_id
          - icustay_id
          - hadm_id
          - time
          - code
          - numeric_value
          - text_value
          - age_offset
          - token_type_ids
          - adm_time_offset
