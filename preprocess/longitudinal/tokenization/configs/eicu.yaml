defaults:
  - tokenization@_here_
  - _self_

use_vocab: true
tensorize: true
add_static_data_to_vocab: true
manually_added_tokens:
  - "[MASK]"
  - "[CLS]"
  - "[SEP]"
  - "[PAD]"
  - "[UNK]"

tensorize_with_labels: false
label_folder: null
split_train_val: false
train_ratio: null
required_codes_fn: required_codes.txt

dataset:
  name: eicu
  stages:
    - name: filter_codes_retain
      params:
        codes_to_keep:
          - MEDS_BIRTH
          - MEDS_DEATH
          - GENDER
          - RACE
          - HOSPITAL_ADMISSION
          - HOSPITAL_DISCHARGE
          - INFECTIOUS_DISEASE
          - DIAGNOSIS
          - INFUSION
          - LAB
          - MEDICATION
          - NONINVASIVE_SYSTOLIC
          - NONINVASIVE_DIASTOLIC
          - TEMPERATURE
          - O2_SATURATION
          - HEART_RATE
          - RESPIRATORY_RATE
        is_prefix: True


    - name: remove_consecutive_same_codes
    - name: preprocessing
      transforms:
        - DemographicData.process_gender
        - DemographicData.process_race
        - InpatientData.process_hospital_admissions
        - InpatientData.process_hospital_discharges # must be before processing diagnoses
        - DeathData.place_death_before_dc_if_same_time
        - MeasurementData.process_simple_measurements
        - LabData.retain_only_test_with_numeric_result
        - ICUStayData.retain_only_infusion_with_numeric_result
      vocab: ${vocab}

    - name: convert_icd_9_to_10
      transforms:
        - DiagnosesData.prepare_codes_for_processing
        - DiagnosesData.convert_icd_9_to_10
      vocab: ${vocab}

    - name: convert_medication_to_atc
      transforms:
        - MedicationData.convert_to_atc
      vocab: ${vocab}

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}_1
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_labs_with_counts
      transforms:
        - LabData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 150
      vocab: ${vocab}

    - name: preprocessing_icu_infusion_with_counts
      transforms:
        - ICUStayData.filter_infusion_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        top_n: 200
      vocab: ${vocab}

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}

    - name: FinalizeData
      params:
        columns: 
          - subject_id
          - hadm_id
          - time
          - code
          - numeric_value
          - text_value
