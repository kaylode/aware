hydra:
  job:
    name: tokenization_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: ${oc.env:LOGGING_DIR}/tokenization/
  sweep:
    dir: ${oc.env:LOGGING_DIR}/tokenization/
    subdir: ${hydra.job.num}

# Set these values
worker: ${oc.env:N_WORKERS}
num_quantiles: 10

# Don't need to set these
input_dir: null
output_dir: null
out_fn: null
vocab: null
code_counts_fn: code_counts.csv
quantiles_fn: quantiles.json
intervals_fn: interval_estimates.json
add_static_data_to_vocab: true
manually_added_tokens: null
icu_ids_path: null
split_train_val: false
train_ratio: null
tensorize_with_labels: false
time_intervals_spec: null