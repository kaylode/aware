defaults:
  - tokenization@_here_
  - _self_

use_vocab: true
tensorize: true
add_static_data_to_vocab: false
required_codes_fn: required_codes.txt

# Finetune
# tensorize_with_labels: true
# label_folder: ${output_dir}/SupervisedData
# split_train_val: true
# train_ratio: 0.9
# do_undersampling_dropout_early_negative_visits: True

# Pretrain
tensorize_with_labels: false
label_folder: null
split_train_val: false
train_ratio: null
do_undersampling_dropout_early_negative_visits: false


time_intervals_spec:
  TIME//7d-12d:
    days: 7
  TIME//12d-20d:
    days: 12
  TIME//20d-30d:
    days: 20
  TIME//30d-2mt:
    days: 30
  TIME//2mt-6mt:
    days: 60
  TIME//=6mt:
    days: 180

manually_added_tokens:
  - "[CLS]"
  - "[SEP]"
  - "[PAD]"
  - "[UNK]"
  - "[MASK]"


dataset:
  name: mimic
  stages:

    - name: write_required_codes
      params:
        output_dir: ${output_dir}
        required_codes_fn: ${required_codes_fn}

    - name: filter_subject_ids
      params:
        subject_ids_path: ${icu_ids_path}
    - name: remove_consecutive_same_codes
    - name: add_age_offsets_as_column # Age as columns for BEHRT-based approaches
      transforms:
        - DemographicData.add_age_offsets_as_column

    - name: add_los_as_code # LOS as code so that it can be used as a filtering feature
      transforms:
        - DemographicData.add_los_as_code
    - name: filter_short_los
      params:
        los_thresh_in_days: 2
        
    - name: filter_codes_retain
      params:
        codes_to_keep:
          # - ADMISSION_TYPE
          - ATC
          # - DRG//
          # - ED_
          # - GENDER
          - HOSPITAL_ADMISSION
          - HOSPITAL_DISCHARGE
          - ICD//CM 
          - ICD//PCS
          # - ICU_ADMISSION
          # - ICU_DISCHARGE
          - LAB
          - INFUSION//
          # - INSURANCE//
          # - MARITAL//
          # - MEDS_BIRTH 
          # - MEDS_DEATH
          - PROCEDURES//
          # - RACE//
          # - TRANSFER//
          # - VITAL//
        is_prefix: true

    - name: add_missing_hospital_admission
      transforms:
        - AdmissionData.add_missing_hospital_admission

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}_1
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_labs_with_counts
      transforms:
        - LabData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 30
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icu_infusion_with_counts
      transforms:
        - ICUStayData.filter_infusion_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 40
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_drg_with_counts
      transforms:
        - InpatientData.filter_drg_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 200
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_procedures_with_counts
      transforms:
        - ProcedureData.filter_procedures_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 80
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_medication_with_counts
      transforms:
        - MedicationData.filter_medication_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 50
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icd10cm_with_counts
      transforms:
        - DiagnosesData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 1000
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: preprocessing_icd10pcs_with_counts
      transforms:
        - ProcedureData.filter_based_on_counts
      params:
        counts: ${output_dir}/${code_counts_fn}_1
        keep_codes_file: ${output_dir}/${required_codes_fn}
        top_n: 100
      vocab: ${vocab}
      skip: ${is_not_null:${vocab}}

    - name: make_quantiles
      transforms:
        - LabData.make_quantiles
        - ICUStayData.make_infusion_quantiles
      vocab: ${vocab}

    - name: Quantizator
      params:
        code_prefixes:
          - LAB//Q//
          - INFUSION//Q//
      agg_to: ${output_dir}/${quantiles_fn}
      agg_params:
        num_quantiles: ${num_quantiles}
      skip: ${is_not_null:${vocab}}

    - name: transform_to_quantiles
      params:
        code_quantiles: ${default_if_null:${vocab},${output_dir}}/${quantiles_fn}

    - name: inject_time_intervals
      params:
        time_intervals_spec: ${time_intervals_spec}

    - name: IntervalEstimator
      params:
        time_intervals_spec: ${time_intervals_spec}
      agg_to: ${output_dir}/${intervals_fn}
      skip: ${is_not_null:${vocab}}

    - name: add_ehrmamba_required_columns
      transforms:
        - TokenTypeIDs.add_token_type_ids
        - AdmissionData.add_admission_time_offsets_as_column

    - name: CodeCounter
      agg_to: ${output_dir}/${code_counts_fn}

    - name: FinalizeData
      params:
        columns: 
          - subject_id
          - admission_id
          - time
          - code
          - age_offset
          - token_type_ids
          - adm_time_offset
          
    - name: LabelGenerator
      params:
        does_split: ${out_fn}
        ratio: ${train_ratio}
        neg_over_pos_thresh: 10
        do_remove_no_hcai_cases_in_early_admissions: ${do_undersampling_dropout_early_negative_visits}
        tasks:
          - next_admission_icd:UTI
          - next_admission_icd:SSI
          - next_admission_icd:SEPSIS
          - next_admission_icd:VAP
          - next_admission_icd:BSI
      agg_to: ${label_folder}

    