###
# LABORATORY RESULTS
###


hosp/labevents:
  lab:
    code:
      - LAB
      - col(label)
      - col(valueuom)
    hadm_id: hadm_id
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum
    text_value: value

icu/chartevents:
 event:
   code:
     - LAB
     - col(label)
     - col(valueuom)
   time: col(charttime)
   time_format: "%Y-%m-%d %H:%M:%S"
   numeric_value: valuenum
   text_value: value
   hadm_id: hadm_id
   icustay_id: stay_id


