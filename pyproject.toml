[build-system]
requires = ["setuptools==75.8.2", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tabpfn_ehr", "scripts", "theseus", "TabDPT"]

[project]
name = "tabpfn_ehr"
version = "1.0.0"
description = "TabPFN for EHR"
readme = "README.md"
authors = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
maintainers = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "transformers==4.49.0",
    "polars==1.25.2",
    "hydra-core==1.3.2",
    "hydra-joblib-launcher==1.2.0",
    "loguru==0.7.3",
    "safetensors==0.5.3",
    "tqdm==4.67.1",
    "wandb==0.19.9",
    "MEDS_transforms==0.1.1",
    "pyarrow==19.0.1",
    "numpy==1.26.4",
    "drug-named-entity-recognition==2.0.5",
    "imbalanced-learn==0.13.0",
    "pytorch-frame==0.3.0",
    "scipy==1.11.4"
]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest"]
jupyter = ["jupyter", "seaborn", "scikit-learn", "matplotlib", "pandas", "altair", "pylatex", "vl-convert-python"]
