[build-system]
requires = ["setuptools==75.8.2", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ehrpfn", "scripts", "preprocess-scripts"]

[project]
name = "ehrpfn"
version = "1.0.0"
description = "EHRPFN: Tailoring Prior-Fitted Networks for Electronic Health Records with Structured Context Retrieval"
readme = "README.md"
authors = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
maintainers = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "transformers==4.49.0",
    "polars==1.25.2",
    "hydra-core==1.3.2",
    "hydra-joblib-launcher==1.2.0",
    "loguru==0.7.3",
    "safetensors==0.5.3",
    "tqdm==4.67.1",
    "wandb==0.19.9",
    "MEDS_transforms==0.1.1",
    "pyarrow==19.0.1",
    "numpy==1.26.4",
    "imbalanced-learn==0.13.0",
    "scipy==1.11.4",
    "pytorch-lightning==2.5.2",
    "scikit-learn==1.6.1",
    "faiss-cpu==1.11.0",
    "gdown==5.2.0",
    "omegaconf==2.3.0",
    "openml==0.15.1",
    "optuna==4.4.0",
    "shap==0.47.1",
    "plotly==6.2.0",
    "tabulate==0.9.0",
    "xgboost==3.0.3",
    "lightgbm==4.6.0",
    "catboost==1.2.8",
    "schedulefree==1.4.1",
    "tensorboard==2.20.0",
    "dill==0.4.0",
    "tabpfn @ git+https://github.com/PriorLabs/TabPFN.git"
]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest"]
jupyter = ["jupyter", "seaborn", "scikit-learn", "matplotlib", "pandas", "altair", "pylatex", "vl-convert-python"]
