[build-system]
requires = ["setuptools==75.8.2", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ehrpfn", "scripts"]

[project]
name = "ehrpfn"
version = "1.0.0"
description = "EHRPFN: Tailoring Prior-Fitted Networks for Electronic Health Records with Structured Context Retrieval"
readme = "README.md"
authors = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
maintainers = [
    { name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = "==3.12.12"
dependencies = [
    "torch==2.6.0",
    "ehr-meds",
    "ehrret",
    "tabpfn",
    "talent",
    "traddl",
    "tradml",
    "ehrdpt",
    "tabpfn-extensions",
    "faiss-gpu-cu12>=1.12.0"
]


[tool.uv]
override-dependencies = [
    "tabpfn-extensions==0.2.2",
    "meds==0.4.1",
    "elasticsearch>=8.12.0",
    "optuna-integration[wandb]>=4.8.0",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = ["pre-commit<4"]
tests = ["pytest"]
jupyter = ["jupyter", "seaborn", "scikit-learn", "matplotlib", "pandas", "altair", "pylatex", "vl-convert-python"]

[tool.pyright]
typeCheckingMode = "off"

[tool.uv.sources]
traddl = { path = "../tabular-training/traddl", editable = true }
tabpfn = { path = "../TabPFN", editable = true }
ehr-meds = { path = "../ehr-meds", editable = true }
talent = { path = "../tabular-training/TALENT", editable = true }
ehrret = { path = "../ehr-retrieval", editable = true }
tradml = { path = "../tabular-training/tradml", editable = true }
ehrdpt = { path = "../ehrpfn-training", editable = true }
