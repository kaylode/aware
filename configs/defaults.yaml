hydra:
  job:
    name: ${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: ${oc.env:LOGGING_DIR}
  sweep:
    dir: ${oc.env:LOGGING_DIR}
    subdir: ${hydra.job.num}

data:
  data_name: eicu
  selection_method: null
  feature_selection_path: null
  embedding_dim: 512
  num_features: 100
  task: null
  remove_aggregated_time_series: false
  sampling:
    do_sampling: false
    max_samples: null
    sampling_method: null
    negative_ratio: 10.0
    imbalance_ratio: null

retrieval:
  retrieval_method: null
  weight_json_path: null
  pretrained_path: null
  context_size: 1024
  inf_batch_size: 512 # when using retrieval
  distance: cosine

inference:
  seed: 42
  model: xgboost
  pretrained_path: null 
  config_path: null # for talent
  tune_config: null # for talent
  talent_root_dir: null # for talent
  output_folder: null 

wandb:
  use_wandb: false
  project: tabpfn-ehr
  entity: kaylode

MODEL: #for wandb logging consistency
  MODEL_NAME: ${inference.model}